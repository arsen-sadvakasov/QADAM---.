name: qadam

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qadam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qadam}
      POSTGRES_DB: ${POSTGRES_DB:-qadam}
    ports:
      - "5432:5432"
    volumes:
      - qadam_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qadam}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-qadam}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-qadam12345}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - qadam_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - qadam_redis_data:/data

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_ENV: development
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-qadam}:${POSTGRES_PASSWORD:-qadam}@postgres:5432/${POSTGRES_DB:-qadam}?sslmode=disable
      MIGRATIONS_PATH: migrations
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-qadam}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-qadam12345}
      MINIO_BUCKET: ${MINIO_BUCKET:-qadam-materials}
      MINIO_USE_SSL: "false"
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  qadam_postgres_data:
  qadam_minio_data:
  qadam_redis_data:
